services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: horizonai
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - horizonai-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - horizonai-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.1
    profiles: ["rocketmq"]
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - horizonai-rocketmq-nameserver:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    profiles: ["rocketmq"]
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-nameserver
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - horizonai-rocketmq-broker:/home/rocketmq/logs
      - horizonai-rocketmq-store:/home/rocketmq/store
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro

volumes:
  horizonai-mysql:
  horizonai-redis:
  horizonai-rocketmq-nameserver:
  horizonai-rocketmq-broker:
  horizonai-rocketmq-store:
