server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/horizonai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      continue-on-error: true

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:horizonai-jwt-secret-dev-only}
  expiration: 86400000  # 24小时

# AI 模型配置
ai:
  model:
    type: deepseek         # deepseek | qwen | openai（预留扩展口）
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key-here}
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat

# GitHub 配置
github:
  api-token: ${GITHUB_API_TOKEN:your_github_token_here}
