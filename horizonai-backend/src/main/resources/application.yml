server:
  port: 8085

external:
  http:
    connect-timeout: 5s
    read-timeout: 60s

pipeline:
  dispatch-mode: ${PIPELINE_DISPATCH_MODE:local} # local | rocketmq
  executor:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
  retry-scan-delay: 15000
  github-sync-cron: "0 0 2 * * ?"
  outbox:
    relay-delay: 1000
    batch-size: 50
    retry-delay: 5s

collector:
  rss:
    urls: ${RSS_FEED_URLS:}

spring:
  application:
    name: horizonai-backend
  datasource:
    url: jdbc:mysql://localhost:3306/horizonai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2s
  sql:
    init:
      mode: never
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      continue-on-error: true

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时

# AI 模型配置
ai:
  analysis:
    prompt-version: v1
  model:
    type: deepseek         # deepseek | qwen | openai（预留扩展口）
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat

# GitHub 配置
github:
  api-token: ${GITHUB_API_TOKEN:}

horizon:
  messaging:
    pipeline-topic: ${PIPELINE_TOPIC:horizonai-pipeline-tasks}
    consumer-group: ${PIPELINE_CONSUMER_GROUP:horizonai-pipeline-consumer}
  security:
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}
  cache:
    redis:
      enabled: ${REDIS_ENABLED:true}
    trend-ttl: 6h
    interest-ttl: 30m
    recommendation-ttl: 15m

management:
  health:
    redis:
      enabled: ${REDIS_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
